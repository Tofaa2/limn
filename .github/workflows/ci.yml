name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Formatting, a full compile and the unit tests. Nothing is drawn here: the
# rendering checks (`zig build verify`) want a GPU and are run locally.
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The unit tests read fonts and textures kept in Git LFS.
          lfs: true
      - name: Install the shader compiler and the examples' windowing library
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libglfw3-dev
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Formatting
        run: zig fmt --check build.zig src examples
      - name: Compile the library, tests and examples
        run: zig build check
      - name: Unit tests
        run: zig build test

  # The same on Windows, where only the shader compiler has to be installed:
  # it comes with the Vulkan SDK.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@d17de7e2f5e50efb5d2123efed18497d3c58c533 # v1
        with:
          cache: true
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0
      - name: Compile the library, tests and examples
        run: zig build check
      - name: Unit tests
        run: zig build test
