name: ci

on:
  push:
  pull_request:

# Formatting, a full compile and the unit tests. Nothing is drawn here: the
# rendering checks (`zig build verify`) want a GPU and are run locally.
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The unit tests read fonts and textures kept in Git LFS.
          lfs: true
      - name: Install the shader compiler and the examples' windowing library
        run: |
          sudo apt-get update
          sudo apt-get install -y glslc libglfw3-dev
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Formatting
        run: zig fmt --check build.zig src examples
      - name: Compile the library, tests and examples
        run: zig build check
      - name: Unit tests
        run: zig build test

  # The same on Windows, where only the shader compiler has to be installed:
  # it comes with the Vulkan SDK.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Install the Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          cache: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Compile the library, tests and examples
        run: zig build check
      - name: Unit tests
        run: zig build test
